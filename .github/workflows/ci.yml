name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, dom, curl, mysqli, pdo, pdo_mysql, zip, bcmath
          coverage: none
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check PHP syntax
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./system/*" -exec php -l {} \;

      - name: Check for common security issues
        run: |
          grep -r "eval(" . --include="*.php" --exclude-dir=vendor --exclude-dir=system || echo "No eval() found"
          grep -r "@\$_" . --include="*.php" --exclude-dir=vendor --exclude-dir=system || echo "No silenced superglobals found"
